<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Velog Alert · 휴대폰 연결</title>
  <link rel="stylesheet" href="./options.css" />
</head>
<body>
  <main>
    <header>
      <div class="logo">V</div>
      <div>
        <p class="eyebrow">VELOG ALERT</p>
        <h1>휴대폰 알림</h1>
      </div>
    </header>

    <section class="card">
      <div class="row">
        <div>
          <strong>휴대폰 알림 사용</strong>
          <p>PC에서 감지한 Velog 새 활동을 연결된 휴대폰 PWA로 전달합니다.</p>
        </div>
        <input id="enabled" type="checkbox" />
      </div>
    </section>

    <section class="card">
      <span class="step">1</span>
      <h2>연결 코드 만들기</h2>
      <p>코드는 10분 동안 한 번만 사용할 수 있습니다.</p>
      <button id="createCode" class="primary">6자리 연결 코드 만들기</button>

      <div id="codeBox" class="code-box hidden">
        <span>연결 코드</span>
        <strong id="code">---</strong>
        <small id="expires">10분 안에 휴대폰에서 입력하세요.</small>
      </div>
    </section>

    <section class="card">
      <span class="step">2</span>
      <h2>휴대폰에서 열기</h2>
      <p id="mobileUrl">https://velog-alert-mobile.netlify.app</p>
      <p class="note">Android: Chrome에서 앱 설치 · iPhone: Safari 공유 → 홈 화면에 추가</p>
    </section>

    <section class="card">
      <div class="title-row">
        <div>
          <span class="step">3</span>
          <h2>연결된 기기</h2>
        </div>
        <button id="refreshDevices" class="text-button">새로고침</button>
      </div>
      <div id="devices" class="devices">
        <p class="muted">연결된 기기를 확인하는 중입니다.</p>
      </div>
    </section>

    <section class="dev card">
      <h2>개발 설정</h2>
      <label>
        Relay URL
        <input id="relayBase" type="url" />
      </label>
      <button id="saveRelay" class="secondary">저장</button>
    </section>

    <div id="status" class="status hidden"></div>
  </main>

  <script type="module" src="./options.js"></script>
</body>
</html>
